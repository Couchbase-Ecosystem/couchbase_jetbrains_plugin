name: UI tests

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  dialog-ui-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Run UI tests with Couchbase in Docker
        run: bash tools/run-ui-tests.sh --stacktrace --console=plain
      - name: Upload test reports, screenshots, and IDE logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: |
            build/reports/tests/uiTest/
            build/reports/uiTest/
            build/test-results/uiTest/
            build/ui-test-sandbox/**/log*/
